aid: liquidstack
name: LiquidStack
description: >-
  LiquidStack is a data center liquid cooling company that designs, manufactures and services
  direct-to-chip and immersion cooling systems for AI, hyperscale, high performance computing,
  edge/5G and cryptocurrency workloads. Its product line spans direct-to-chip coolant distribution
  units — the CDU-1MW at up to 1,350kW of cooling at N+1 and the modular GigaModular CDU-10MW
  platform — alongside single-phase and two-phase immersion DataTank systems rated to 252kW, plus
  full lifecycle services covering consulting, installation, training and maintenance. The company
  spun out of Bitfury in 2021, raised $20 million from Tiger Global, is headquartered in Carrollton,
  Texas with engineering, R&D and manufacturing operations in Texas and Hong Kong, and was acquired
  by Trane Technologies in a deal completed in March 2026. LiquidStack sells capital equipment and
  services rather than software: it operates no developer program and publishes no public API,
  specification, SDK or developer portal. The only machine interface it documents is embedded in
  the hardware — its CDUs ship with native MODBUS TCP/IP or a RESTful API, plus BACnet/IP and SNMP,
  for remote management from a customer's own building or data center management system.
